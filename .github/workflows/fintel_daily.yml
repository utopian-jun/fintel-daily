name: Fintel Daily Update

on:
  schedule:
    # 평일(월~금) 21:30 UTC = 익일 06:30 KST  (미국장 마감 ~30분 후)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:   # GitHub UI에서 수동 실행 가능

jobs:
  update:
    runs-on: self-hosted   # 내 Mac에서 실행 — Cloudflare 우회 + 로컬 Chrome
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip3 install -r requirements.txt

      - name: Run Fintel scraper & update Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 fintel_daily.py
